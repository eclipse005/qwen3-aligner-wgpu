name: build

# Tests run on every push and PR: they take seconds and need no checkpoint.
# Packaging only happens for a release tag, or when asked for by hand.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build and upload the three platform binaries
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  BIN: align

# A newer push to the same ref cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The vendored soxr is built by build.rs through cmake, which the runner
      # has; no checkpoint or baseline files are involved.
      - run: cargo test --release --all-targets

  package:
    name: ${{ matrix.name }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # `macos-14` and later are Apple Silicon runners, so this is a native
          # arm64 build rather than a cross-compile.
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin ${{ env.BIN }} --target ${{ matrix.target }}

      # The binary alone.  The checkpoint is ~1.7 GB and licensed separately, so
      # whoever runs this fetches it; it is not shipped here.  The `ja` feature
      # is on by default, which embeds a ~17 MB Japanese tokenizer model.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar czf ${{ env.BIN }}-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release ${{ env.BIN }}
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ env.BIN }}.exe" -DestinationPath "${{ env.BIN }}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.name }}
          path: |
            ${{ env.BIN }}-${{ matrix.name }}.tar.gz
            ${{ env.BIN }}-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

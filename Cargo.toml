[workspace]

[package]
name = "qwen3-aligner-wgpu"
version = "0.1.0"
edition = "2021"
description = "wgpu inference backend for Qwen3-ForcedAligner"

[lib]
name = "qwen3_aligner_wgpu"
path = "src/lib.rs"


[features]
default = ["ja"]
# Japanese word segmentation.  `nagisa_rs` is a path dependency on a sibling
# checkout (`D:\nagisa-rs`), so it is optional: the crate must still build
# wherever that tree is absent, just without `--language Japanese`.
ja = ["dep:nagisa_rs"]

[dependencies]
wgpu = "30.0.1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
anyhow = "1"
memmap2 = "0.9"
bytes = "1.11"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", features = ["onig"] }
hound = "3"
rustfft = "6"
gemm = "0.18"
rayon = "1.10"
libm = "0.2"
unicode-general-category = "1.1.0"
nagisa_rs = { version = "0.1.0", path = "../nagisa-rs", optional = true }
thiserror = "2.0.20"

[build-dependencies]
cmake = "0.1"

[profile.release]
debug = false

